<!doctype html><html lang="vi"><head><base target="_top"><style>body{font:13px Arial,sans-serif;background:#faf9f5;color:#183d34;padding:12px}h2{font-size:20px}label{display:block;font-weight:600;margin:18px 0 7px}textarea{width:100%;box-sizing:border-box;min-height:65px;padding:10px;border:1px solid #cbd4c2;border-radius:4px;font:13px Arial}button{background:#244e40;color:white;border:0;padding:12px 15px;border-radius:4px;cursor:pointer;margin:7px 0;width:100%}button:disabled{opacity:.5;cursor:wait}p{line-height:1.7}#status{padding:10px;background:#e8ebd5;position:sticky;top:0;font-size:12px}small{color:#6d7564;line-height:1.6;display:block}img{max-width:100%;max-height:130px;object-fit:cover;margin-top:8px}.bar{position:sticky;bottom:0;background:#faf9f5;padding-top:8px}</style></head><body><h2>Nội dung website</h2><p>Sửa nội dung → Lưu bản nháp → Xuất bản.</p><div id="status" role="status">Đang tải…</div><div id="fields"></div><div class="bar"><button onclick="save()">Lưu bản nháp</button><button onclick="publish()">Xuất bản lên website</button></div><script>
let items=[];let saved=true;
function status(s){document.getElementById('status').textContent=s}
function busy(b){document.querySelectorAll('button').forEach(x=>x.disabled=b)}
function fail(e){busy(false);status('Chưa thực hiện được: '+e.message)}
google.script.run.withSuccessHandler(data=>{items=data;const fields=document.getElementById('fields');data.forEach((item,i)=>{const label=document.createElement('label');label.textContent=item.label;const field=document.createElement('textarea');field.value=item.value;field.oninput=()=>{items[i].value=field.value;saved=false;status('Có thay đổi chưa lưu.');if(image&&/^https:\/\//.test(field.value)) image.src=field.value;};fields.append(label,field);let image=null;if(item.key.endsWith('Image')){const hint=document.createElement('small');hint.textContent='Chọn ảnh JPG/PNG/WebP dưới 5 MB từ máy. Ảnh được tải lên Drive và chia sẻ công khai để hiển thị trên website. Bạn cũng có thể dán đường dẫn ảnh HTTPS.';fields.append(hint);image=document.createElement('img');image.alt='Xem ảnh';image.referrerPolicy='no-referrer';if(/^https:\/\//.test(item.value))image.src=item.value;image.onerror=()=>{image.style.display='none'};fields.append(image);const upload=document.createElement('input');upload.type='file';upload.accept='image/jpeg,image/png,image/webp';upload.onchange=()=>{const file=upload.files[0];if(!file)return;if(file.size>5*1024*1024){status('Chọn ảnh dưới 5 MB.');return}busy(true);status('Đang tải ảnh…');const reader=new FileReader();reader.onerror=()=>fail(new Error('Không đọc được file ảnh.'));reader.onload=()=>{google.script.run.withSuccessHandler(url=>{field.value=url;items[i].value=url;saved=false;image.style.display='block';image.src=url;busy(false);status('Đã tải ảnh. Bấm Lưu bản nháp, sau đó Xuất bản.');}).withFailureHandler(fail).uploadImage({name:file.name,mime:file.type,base64:String(reader.result).split(',')[1]});};reader.readAsDataURL(file);};fields.append(upload)}});status('Đã tải. Bạn có thể chỉnh sửa nội dung.');}).withFailureHandler(fail).getEditorData();
function save(){busy(true);google.script.run.withSuccessHandler(s=>{saved=true;busy(false);status(s)}).withFailureHandler(fail).saveDraft(items)}
function publish(){if(!saved){status('Hãy bấm Lưu bản nháp trước khi xuất bản.');return}busy(true);google.script.run.withSuccessHandler(s=>{busy(false);status(s)}).withFailureHandler(fail).publishContent()}
</script></body></html>
